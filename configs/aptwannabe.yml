# VMW per-VM profile
# Values here override interactive prompts in modules. Omit a value to
# fall back to the interactive prompt (menu mode).

name: aptwannabe

vm:
  memory_mib: 8192
  vcpus: 8
  osinfo: win10

cpu:
  topology:
    sockets: 1
    cores: 4
    threads: 2
  check: none
  migratable: "off"
  cache: passthrough
  maxphysaddr: passthrough

boot:
  order: "cdrom,hd"
  menu: "on"
  loader: /opt/vmw/firmware/OVMF_CODE.fd
  loader_secure: "yes"
  nvram_template: /opt/vmw/firmware/OVMF_VARS.fd

features:
  hyperv: true
  kvm_hidden: true
  pmu: "off"
  vmport: "off"
  smm: "on"
  msrs_unknown: fault
  ps2: "off"

hyperv:
  mode: custom
  relaxed: "on"
  vapic: "on"
  spinlocks: "on"
  spinlocks_retries: 8191
  vendor_id_state: "on"
  vendor_id: 1234567890ab

clock:
  offset: localtime
  tsc_present: "yes"
  tsc_mode: native
  kvmclock_present: "no"
  hypervclock_present: "yes"

pm:
  suspend_to_mem: "yes"
  suspend_to_disk: "yes"

device:
  emulator: /opt/vmw/emulator/bin/qemu-system-x86_64
  disk_path: /var/lib/libvirt/images/APTWannabe-new.qcow2
  disk_size_gb: 150
  disk_bus: nvme
  disk_cache: none
  disk_io: native
  disk_block_logical: 4096
  disk_block_physical: 4096
  nic_model: e1000e
  sound_model: ich9
  audio_type: pipewire
  graphics: spice
  video: vga
  tpm: emulator
  tpm_model: tpm-crb
  memballoon: none

paths:
  downloads_dir: /var/lib/libvirt/boot
  iso_path: /var/lib/libvirt/boot/Win10_22H2_English_x64v1.iso

patches:
  kernel: amd702.mypatch
  qemu: AMD-v11.0.3.patch
  edk2: AMD-edk2-stable202605.patch

smbios:
  file: /opt/vmw/firmware/smbios.bin

evdev:
  enabled: true
  grab_toggle: ctrl-ctrl

audio:
  pipewire: true
  mixing_engine: "no"
